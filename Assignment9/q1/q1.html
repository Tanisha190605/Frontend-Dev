<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        #search-box {
            width: 350px;
            padding: 10px;
            font-size: 18px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        #results {
            margin-top: 20px;
        }

        .product {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .product img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
        }
        #loading {
            display: none;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h2>Live Product Search</h2>

    <input type="text" id="search-box" placeholder="Search products...">
    <div id="loading">Searching...</div>

    <div id="results"></div>

    <script src="q1.js"></script>
</body>
</html>
