<!DOCTYPE html>
<html>
<head>
    <title>Employee Status Dashboard</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        .active {
            color: green;
            font-weight: bold;
        }

        .inactive {
            color: red;
            font-weight: bold;
        }

        .toggle-btn {
            padding: 5px 12px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
        }

        .active-btn {
            background-color: green;
        }

        .inactive-btn {
            background-color: red;
        }

        #error {
            margin-top: 20px;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Employee Status Dashboard</h2>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Toggle</th>
        </tr>
    </thead>
    <tbody id="employee-body"></tbody>
</table>

<p id="error"></p>

<script src="q2.js"></script>

</body>
</html>
